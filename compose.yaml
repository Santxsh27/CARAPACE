name: carapace

services:
  data-init:
    build:
      context: .
      target: runtime
    image: carapace-core:local
    user: "0:0"
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN"]
    security_opt:
      - no-new-privileges:true
    entrypoint: ["chown"]
    command: ["-R", "10001:10001", "/data"]
    volumes:
      - carapace-data:/data

  api:
    build:
      context: .
      target: runtime
    image: carapace-core:local
    environment:
      CARAPACE_ENV: development
      CARAPACE_DB_PATH: /data/carapace.db
      CARAPACE_TENANT_KEYS_JSON: '{"demo-bank":"local-demo-key-change-me"}'
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - carapace-data:/data
    depends_on:
      data-init:
        condition: service_completed_successfully

  verifier:
    profiles: ["tools"]
    build:
      context: .
      target: runtime
    image: carapace-core:local
    entrypoint: ["carapace"]
    command:
      - verify
      - examples/payment-promise.json
      - examples/execution-valid.json

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    image: carapace-core-test:local

  duplicate-debit-demo:
    profiles: ["tools"]
    build:
      context: .
      target: runtime
    image: carapace-core:local
    entrypoint: ["carapace"]
    command:
      - verify
      - examples/payment-promise.json
      - examples/execution-duplicate-debit.json

  demo:
    profiles: ["tools"]
    build:
      context: .
      target: runtime
    image: carapace-core:local
    entrypoint: ["carapace-demo"]
    command: ["--base-url", "http://api:8080"]
    depends_on:
      api:
        condition: service_healthy

  anthos-ledger:
    profiles: ["anthos"]
    platform: linux/amd64
    image: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/ledger-db:v0.6.10@sha256:891cb7afe34f358ce7ed7002a1923b25e113b30bca44fecb10cc8b116d665a03
    environment:
      POSTGRES_DB: postgresdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      # Upstream's init script only disables seeds when this is empty.
      USE_DEMO_DATA: ""
      LOCAL_ROUTING_NUM: "883745000"
    volumes:
      - anthos-ledger-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgresdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  anthos-demo:
    profiles: ["anthos"]
    build:
      context: .
      target: runtime
    image: carapace-core:local
    entrypoint: ["carapace-anthos-web"]
    environment:
      CARAPACE_DEMO_ENABLED: "true"
      CARAPACE_API_BASE_URL: http://api:8080
      CARAPACE_TENANT: demo-bank
      CARAPACE_API_KEY: local-demo-key-change-me
      BOA_DATABASE_URL: postgresql://admin:password@anthos-ledger:5432/postgresdb
      PORT: "8090"
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      api:
        condition: service_healthy
      anthos-ledger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  carapace-data:
  anthos-ledger-data:
