[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carapace-core"
version = "0.1.0"
description = "Deterministic trust core for CARAPACE payment assurance"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
carapace = "carapace_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

