[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carapace-core"
version = "0.13.1"
description = "Financial Friday: AI-planned financial tasks with a deterministic safety kernel"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "google-genai>=1,<2",
  "google-cloud-firestore>=2.20,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
]

[project.scripts]
carapace = "carapace_core.cli:main"
carapace-api = "carapace_api.__main__:main"
carapace-demo = "carapace_core.api_demo:main"
carapace-anthos-demo = "carapace_integrations.anthos_demo:main"
carapace-anthos-web = "carapace_integrations.anthos_web:main"
carapace-witness-audit = "carapace_core.checkpoint_monitor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
carapace_integrations = ["assets/*.png"]
