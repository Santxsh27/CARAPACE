name: CARAPACE foundation checks

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CARAPACE
        run: python -m pip install .
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Verify valid reference payment
        run: carapace verify examples/payment-promise.json examples/execution-valid.json

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build --tag carapace-core:ci .
      - name: Run tests in container
        run: docker compose run --rm tests
