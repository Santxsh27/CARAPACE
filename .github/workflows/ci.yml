name: CARAPACE foundation checks

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CARAPACE
        run: python -m pip install ".[test]"
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Verify valid reference payment
        run: carapace verify examples/payment-promise.json examples/execution-valid.json

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build --tag carapace-core:ci .
      - name: Run tests in container
        run: docker build --target test --tag carapace-core-test:ci .
      - name: Execute container tests
        run: docker run --rm carapace-core-test:ci
      - name: Verify Compose API and persistent evidence volume
        run: |
          docker compose up --detach --build api
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health/ready; then
              break
            fi
            if [ "$attempt" = "20" ]; then
              docker compose logs api
              exit 1
            fi
            sleep 1
          done
          test "$(docker compose exec -T api id -u)" = "10001"
          test "$(docker compose exec -T api stat -c %u /data)" = "10001"
      - name: Clean up Compose services
        if: always()
        run: docker compose down --volumes
