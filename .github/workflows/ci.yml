name: CARAPACE foundation checks

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CARAPACE
        run: python -m pip install ".[test]"
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Evaluate Friday proposal safety (no payments or AI calls)
        run: python -m carapace_core.friday_evaluation > friday-safety-evaluation.json
      - name: Preserve proposal evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: friday-safety-python-${{ matrix.python-version }}
          path: friday-safety-evaluation.json
      - name: Verify valid reference payment
        run: carapace verify examples/payment-promise.json examples/execution-valid.json

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build --tag carapace-core:ci .
      - name: Run tests in container
        run: docker build --target test --tag carapace-core-test:ci .
      - name: Execute container tests
        run: docker run --rm carapace-core-test:ci
      - name: Verify Compose API and persistent evidence volume
        run: |
          docker compose up --detach --build api
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health/ready; then
              break
            fi
            if [ "$attempt" = "20" ]; then
              docker compose logs api
              exit 1
            fi
            sleep 1
          done
          test "$(docker compose exec -T api id -u)" = "10001"
          test "$(docker compose exec -T api stat -c %u /data)" = "10001"
      - name: Clean up Compose services
        if: always()
        run: docker compose down --volumes

  bank-of-anthos-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the official Bank of Anthos ledger slice
        run: docker compose --profile anthos up --detach --build anthos-demo
      - name: Wait for the local integration page
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8090/api/status > status.json; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              docker compose --profile anthos logs
              exit 1
            fi
            sleep 2
          done
          jq -e '.api == true and .ledger == true' status.json
      - name: Verify a real ledger row and duplicate-debit incident
        run: |
          curl --fail-with-body --silent --request POST \
            http://127.0.0.1:8090/api/run > result.json
          jq . result.json
          jq -e '.correct_payment_verdict == "MATCH" and
                 .duplicate_payment_verdict == "MISMATCH" and
                 .overall == "PASS"' result.json
      - name: Clean up the integration
        if: always()
        run: docker compose --profile anthos down --volumes
